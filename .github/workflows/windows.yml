name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Frontend types and production build
        working-directory: apps/desktop
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm run check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Isolated server tests
        run: cargo test --locked -j 2 -p cursor-server --lib --tests --no-fail-fast
      - name: Native desktop compile check
        run: cargo check --locked -p cursor-byok-desktop
